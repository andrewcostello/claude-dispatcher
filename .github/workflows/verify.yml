# The gate PR0's comments name. Before this file existed, every "runs in
# CI / CI diffs / wired as CI" claim in the boundary artifacts was false —
# the repo had no CI at all (panel round 3). Two jobs, matching the
# environment matrix the code already implements:
#
#   gate         — the full repo suite in the peer-ABSENT configuration
#                  (doc-local T26 checks enforced, citations skipped and
#                  announced). This is what a dispatched worktree sees.
#   citations    — the peer-PRESENT configuration: checks out
#                  claude-workflow beside this repo and runs the
#                  citations-REQUIRED form (`make verify`), so a rotted
#                  file:line or symbol citation is caught.
name: verify

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: repo gate (peer-absent matrix arm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Assert the peer is genuinely absent for this arm
        run: |
          if python tools/t26_lint.py --probe-peer >/dev/null 2>&1; then
            echo "peer unexpectedly resolvable in the peer-absent arm" >&2
            exit 1
          fi
      - name: Mechanical gate (scripts/test.sh — same script .dispatcher.yaml runs)
        run: bash scripts/test.sh

  citations:
    name: T26 citations at the pinned baselines (peer-present arm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # citations resolve against a pinned SHA
          path: claude-dispatcher
      # NO continue-on-error: this job's whole purpose is the
      # citations-REQUIRED half. If the peer cannot be checked out, the job
      # FAILS — the claim "CI always requires the peer" must not outrun its
      # enforcement (panel round 4). The doc-local checks still run
      # unconditionally in the `gate` job above.
      - name: Check out the peer repo beside it
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/claude-workflow
          fetch-depth: 0
          path: claude-workflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: claude-dispatcher
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Assert the peer really did resolve (citations are REQUIRED here)
        working-directory: claude-dispatcher
        env:
          CLAUDE_WORKFLOW_REPO: ${{ github.workspace }}/claude-workflow
        run: python tools/t26_lint.py --probe-peer
      - name: make verify (boundary seals + citations-REQUIRED T26)
        working-directory: claude-dispatcher
        env:
          CLAUDE_WORKFLOW_REPO: ${{ github.workspace }}/claude-workflow
        run: make verify
