# Per-repo dispatcher config (schema introduced in VG-1).
# test: shell command run inside a task worktree; exit 0 = green.
#
# One definition of the mechanical gate: scripts/test.sh (also what
# `make test` runs, so the two cannot drift). It resolves the interpreter
# (DISPATCHER_TEST_PYTHON → $ROOT/.venv → python3), runs pytest tests/
# (which includes tests/boundary), and runs tools/t26_lint.py — with the
# pinned-baseline citation half enabled whenever the claude-workflow peer
# checkout is resolvable ($CLAUDE_WORKFLOW_REPO or the sibling directory);
# worktrees without a peer still run every doc-local check. The
# citations-required form is `make verify-t26` / CI.
#
test: |
  exec bash "$(git rev-parse --show-toplevel)/scripts/test.sh"

# Cross-family panel: probationary advisory seats (VG-5).
panel:
  advisory: [grok]

# Fleet defaults (Phase 7): leave implementer unpinned in YAML for routing.py
# cheap-first (grok on leaves; claude on hard). Dogfood: --no-claude.
# implementer: grok   # optional repo pin
