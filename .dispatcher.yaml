# Per-repo dispatcher config (schema introduced in VG-1).
# test: shell command run inside a task worktree; exit 0 = green.
#
# One definition of the mechanical gate: scripts/test.sh (also what
# `make test` runs, so the two cannot drift). The interpreter comes from
# scripts/python.sh — the single resolution ladder, exactly
# DISPATCHER_TEST_PYTHON → $ROOT/.venv → python3, with NO per-developer
# absolute paths (a host whose checkout lives elsewhere exports
# DISPATCHER_TEST_PYTHON). test.sh runs pytest tests/ (which includes
# tests/boundary) and then tools/t26_lint.py, deciding the citation half
# with t26_lint's own --probe-peer predicate: peer present ⇒ full checks;
# peer absent (dispatched worktree) ⇒ degraded mode that still enforces
# every doc-local check and announces itself on stderr, never a hard fail.
# The citations-required form is `make verify-t26` / CI.
#
test: |
  exec bash "$(git rev-parse --show-toplevel)/scripts/test.sh"

# Declares that this repo KNOWS HOW to exclude a row, and how. Without this key
# a non-empty active register is a named blocking fault
# (known_red.RegisterFault.UNSUPPORTED_STYLE) rather than a gate that quietly
# goes red on rows the task cannot fix.
#
# The register is consumed inside scripts/test.sh rather than inline here, so
# `make test` and the dispatcher gate cannot drift — which is the whole reason
# the command was extracted. Extracting it had silently dropped D-68's support;
# restored there as part of this merge.
test_exclusion: pytest-deselect

# Cross-family panel: probationary advisory seats (VG-5).
panel:
  advisory: [grok]

# Fleet defaults (Phase 7): leave implementer unpinned in YAML for routing.py
# cheap-first (grok on leaves; claude on hard). Dogfood: --no-claude.
# implementer: grok   # optional repo pin
# cascade.terminal is CLI-only today (--cascade-terminal / --no-claude)

# Dogfood: dispatcher run … --no-claude

# Run artifacts live OUTSIDE the repo. `docs/runs/` is gitignored (so it is not
# in history) AND sits inside a disposable worktree, so the audit trail dies with
# the worktree. Relative to the REPO ROOT, so every worktree shares one location.
runs_dir: ../dispatcher-runs
