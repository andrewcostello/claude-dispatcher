# Classifier frame/wrapper protocol — the machine-readable transcription of
# design §3.3 (canonical v2 wire, response wrapper, bounds, contract
# selection) and §8 (the octet-normative request frame).
#
# Source of truth: docs/plans/2026-08-02-classification-gating-design.md (v20).
# This is the contract package both repos test against (plan §1): PR1's Go
# `cmd/classify` change implements exactly this frame/wrapper; PR2/PR3's
# dispatcher side parses against it. Golden and malformed vectors live in
# schema/testdata/classifier_frames/ and are generated deterministically by
# tools/fsmgen.py from the constants here (T10 consumes them in PR1/PR3).

schema_version: 1
design_doc: docs/plans/2026-08-02-classification-gating-design.md

request_frame:
  # One framed stdin request carries BOTH authoritative inputs (round 11:
  # the pinned classifier already reads the diff on stdin, so `-risk-paths -`
  # left two authoritative streams contending for one descriptor).
  # Octet-normative layout (§8):
  #   u32be outer_len | u8 version=1 | u64be policy_len | policy
  #                   | u64be diff_len | diff
  flag: -authoritative-stdin
  layout:
    - {field: outer_len,  type: u32be, meaning: octet length of everything after this field}
    - {field: version,    type: u8,    value: 1}
    - {field: policy_len, type: u64be}
    - {field: policy,     type: bytes, length_from: policy_len}
    - {field: diff_len,   type: u64be}
    - {field: diff,       type: bytes, length_from: diff_len}
  # No digests in the request; the producer computes its own (round 12,
  # claude: an echo of request-supplied digests verifies nothing — copy-back
  # is impossible by construction).
  request_digests: none
  reject: >-
    Truncated lengths, trailing bytes, or lengths beyond the bounds below ⇒
    producer exits nonzero. A local pathname for either input is never valid
    in REQUIRED mode.

bounds:
  # Constants in the machine-readable schema (§3.3); enforced BEFORE JSON
  # materialization — overflow ⇒ MALFORMED_OUTPUT.
  policy_max_bytes: 1048576      # 1 MiB
  diff_max_bytes: 10485760       # 10 MiB (§3.4's ceiling)
  producer_output_max_bytes: 2097152  # 2 MiB

response_wrapper:
  # Version-independent response wrapper (§3.3): the envelope rides inside it.
  fields:
    response_version: {type: int, value: 1}
    computed_config_sha256: {type: sha256_lowercase_hex, over: the policy bytes the producer consumed}
    computed_diff_sha256: {type: sha256_lowercase_hex, over: the diff bytes the producer consumed}
    classification: {type: object, meaning: the v1|v2 payload}
  rules:
    - no request_id — the two digests already bind the response to the exact request bytes
    - missing/unknown response_version major ⇒ ClassifyFailed(INCOMPATIBLE_CONTRACT)
    - ClassifyOk requires both wrapper digests to equal the authoritative ones
      in EVERY REQUIRED contract mode (else SUBJECT_MISMATCH)
    - the envelope carries no digest fields and no classified_at

digest_encoding: lowercase hex SHA-256

contract_selection:
  # Genesis decision, never per-parse inference (§3.3, round 9 codex).
  modes: [V2, V1_COMPAT]
  v1_compat: >-
    a named adapter for the envelope shape only, and only for a
    new-capability producer emitting the legacy shape; entered only via the
    genesis record. Under V1_COMPAT only, absent config_scaffold desugars to
    false before the equation check; under V2 presence is required.

capability_probe:
  # Preflight probes the pinned producer binary — pinned by digest, probed
  # with an explicit capability invocation whose exit code and output are
  # contractual, never help-text scraping (§3.3, round 10 claude). The probe
  # covers the tuple {framed -authoritative-stdin (policy + diff), dual
  # digest echo, contract flag}; a producer failing it fails REQUIRED
  # preflight — the operator's only fallback is explicit LEGACY.
  #
  # The design fixes the obligation; the concrete invocation and exit values
  # below are PR0 contract constants — PR1 implements exactly these.
  invocation: "classify -capability-probe -contract-version <1|2>"
  runs: the exact framed protocol against a built-in probe frame
  exit_codes:
    capability_supported: 0     # probe frame parsed, wrapper with both digests emitted
    malformed_frame: 2          # truncated length, trailing bytes, or bound overflow
    unsupported_contract: 3     # contract version not supported by this binary
    probe_unsupported: 4        # binary predates the probe — fails REQUIRED preflight

# Golden vectors (generated by tools/fsmgen.py; committed; T10 fixtures).
# Frame bytes are deterministic: fixed policy/diff payloads, no timestamps.
vectors:
  directory: schema/testdata/classifier_frames
  index: vectors.json
  policy_payload: '{"schema_version": 1, "unmatched_risk": "high", "rules": []}'
  diff_payload: |
    diff --git a/x.go b/x.go
    index 0000000..1111111 100644
    --- a/x.go
    +++ b/x.go
    @@ -1 +1 @@
    -old
    +new
  cases:
    - {name: valid_frame,      file: valid_frame.bin,      expect: accept}
    - {name: malformed_length, file: malformed_length.bin, expect: reject, reason: policy_len exceeds the frame's remaining octets}
    - {name: truncation,       file: truncation.bin,       expect: reject, reason: frame cut short mid-diff}
    - {name: trailing_data,    file: trailing_data.bin,    expect: reject, reason: bytes after the last declared field}
