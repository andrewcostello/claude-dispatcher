# Known-red register (D-68): rows a SEALS task committed RED by design, which no
# other task can green and none should be failed by.
#
# Behaviour: rows are hidden from every task's gate EXCEPT `body_task`'s (greening
# them is its deliverable), and the entry retires automatically once `body_task`
# is Done. A row that no longer exists deselects nothing, so a stale entry leaves
# the row running and cannot hide a regression.
#
# To add one:
#   1. Prove it is red, by exit code only:
#        PYTHONPATH=src pytest 'tests/test_x.py::test_y' -q     # must be non-zero
#   2. Add the entry. `rows` are node ids exactly as pytest prints them,
#      parametrised ids keeping their brackets and spaces — but QUOTE every row.
#      A parametrised id may contain ": ", which YAML reads as a mapping: 50 of
#      the 106 rows registered on 2026-08-18 parsed as CommentedMap and the
#      loader refused the whole entry ("holds a non-string or blank row").
#      Double quotes are safest — ids also contain apostrophes.
#   3. Commit it: the point of a tracked file is a reviewable, attributed diff.
#
# No dispatched role may write this file — it is in `role_protocol.FLOOR_GLOBS`.
# Operator commits are not task branches, so a human can. An agent that needs an
# entry must report it.
#
# `.dispatcher.yaml` must carry `test_exclusion:` and read
# $DISPATCHER_KNOWN_RED_FILE, or active entries BLOCK with a named fault.

