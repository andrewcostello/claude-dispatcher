[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-dispatcher"
version = "0.1.0"
description = "Orchestrate the Tasker role across many tasks in a YAML file. Each task runs in an isolated Claude Code session with fresh context."
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
# PyYAML is a DEV dependency: tools/fsmgen.py and tests/boundary read the
# schema/*.yaml contract package with yaml.safe_load. It is deliberately not
# a runtime dependency — nothing under src/ imports it, and the generated
# boundary module is pure stdlib. safe_load (not the repo's ruamel yaml_io)
# because these reads are load-only and must NOT round-trip comments: a
# schema read that could rewrite the file is a write path into the safety
# truth. If boundary/ ever ships a runtime schema read, move this line up.
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "PyYAML>=6",
]

[project.scripts]
dispatcher = "claude_dispatcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# ALL prompt assets must ship in the wheel — a pipx install without them
# breaks the corresponding stage at runtime (hit live twice on 2026-07-13:
# gpa-wave1 verifier_unavailable on verifier_prompts/, then gpa-wave1b
# cross_family_panel_error on reviewer_prompts/). tests/test_packaging.py
# walks the source tree and fails on any non-.py asset this glob misses.
claude_dispatcher = ["*_prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
