[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-dispatcher"
version = "0.1.0"
description = "Orchestrate the Tasker role across many tasks in a YAML file. Each task runs in an isolated Claude Code session with fresh context."
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[project.scripts]
dispatcher = "claude_dispatcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# ALL prompt assets must ship in the wheel — a pipx install without them
# breaks the corresponding stage at runtime (hit live twice on 2026-07-13:
# gpa-wave1 verifier_unavailable on verifier_prompts/, then gpa-wave1b
# cross_family_panel_error on reviewer_prompts/). tests/test_packaging.py
# walks the source tree and fails on any non-.py asset this glob misses.
# The Go signature helper (unit D2) is a non-.py asset under the package for
# the same reason: the gate judges branches in OTHER repositories, so the
# helper must travel with the dispatcher rather than be read out of the tree
# under judgement. An install that drops it is
# ComparatorFault.HELPER_MISSING — a named, blocking state, never "no Go here".
#
# The TypeScript helper (unit D4) is the same argument again, with one wrinkle:
# `typescript.js` is fetched at install time rather than tracked in git (it is
# 9.1 MB of third-party code; see .gitignore and TS_VENDORED_PARSER_SHA256), so
# this glob ships it only when the wheel is BUILT on a machine that already ran
# `python3 -m claude_dispatcher.ts_parser_vendor`. A wheel built without it
# installs a dispatcher whose TypeScript comparator is HELPER_MISSING — named
# and blocking, never "no TypeScript here" — and the fix is to run the fetcher
# on the installed copy. The glob is FLAT and does not recurse, which is why
# TS_HELPER_PACKAGE_DIR is a flat trio rather than a `node_modules` layout.
#
# The Go call-reachability helper (unit D6) is the D2 argument a third time and
# with more force: it computes a CALL GRAPH, so a helper read out of the judged
# repository would be supplied by the branch whose call graph it is computing.
# An install that drops it is AnalyzerFault.HELPER_MISSING — named and blocking
# — never "no Go analysis here". The glob is FLAT and ships two files, main.go
# and go.mod; there is deliberately no built binary to ship, and the reason is
# at GO_REACHABILITY_ANALYZER in go_reachability.py.
claude_dispatcher = [
    "*_prompts/*.md",
    "go_signature_fingerprint/*",
    "ts_signature_fingerprint/*",
    "go_call_reachability/*",
    # The state-machine reader (Go). Same argument as the two above: the
    # gate judges branches in OTHER repositories, so the helper must travel
    # with the dispatcher rather than be read out of the tree under
    # judgement. An install that drops it is GoHelperUnavailable — named and
    # blocking, never "no declaration here".
    "go_state_machine/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# The suite builds ~50k files of git repos under tmp_path per run; the
# default of retaining 3 session roots exhausts tmpfs inodes across runs.
# (Per-test "failed"/"none" retention is NOT safe here: orchestrator tests
# reference earlier tests' tmp dirs within a session.)
tmp_path_retention_count = 1
