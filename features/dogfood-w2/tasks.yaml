  # ---- W2-2  a new file's symbols are all "added" -------------------------
  - key: W2-2-1
    summary: scaffold — a sealed interface widened from a second file is not an added symbol
    description: |
      RE-MEASURED at `feat/D1-role-protocol @ 6293f42` by driving
      `compare_signatures` directly. The SAME widening, once in place and once
      arriving as a new file:

          compare_signatures("src/pkg/wallet.py",    sealed, widened) -> checked, 1 change
          compare_signatures("src/pkg/wallet_v2.py", None,   widened) -> checked, 0 changes

      And the same, for TypeScript, with the vendored parser:

          compare_signatures("web/src/w.ts",  sealed, widened) -> checked, 1 change
          compare_signatures("web/src/w2.ts", None,   widened) -> checked, 0 changes

      `enrolled_languages()` at this revision is `['python', 'go',
      'typescript']`. The rule is protocol-level, not comparator-level —
      `compare_signatures`' own docstring: "What is NOT [language-specific] —
      added is not a change, removed is, a differing fingerprint is, A NEW FILE
      HAS NOTHING TO PRESERVE ... is decided HERE, once, for every language."
      So D4 (TypeScript) and D6 (Go) did NOT change it and could not have: they
      added rows to a registry that does not get to answer this question.

      RECORDED AND ACCEPTED ONCE, and the record is in the module rather than
      only in the log — `role_protocol.py`, "WHAT THIS DESIGN CANNOT DO":

        "Cross-file declaration merging is invisible, and it is a real bypass.
         The gate compares one file at a time. TypeScript lets a second file
         widen an existing interface ... A NEW file has no base revision, so
         every symbol in it is an ADDED symbol, and an added symbol is not a
         change. A body agent can therefore widen a sealed type without editing
         the file it was sealed in. Go has a weaker version of this (a new file
         adding methods to an existing type); TypeScript's is a first-class
         language feature and is THE SINGLE LARGEST HOLE IN THIS CONTRACT."

      That paragraph also names the fix and its address: "Closing it needs a
      whole-diff comparison rather than a per-file one, which is a change to
      `_compare_branch_signatures`, not to a comparator."

      THE COST THAT DECIDES THE SHAPE, and it is why this is a scaffold and not
      a patch: `_compare_branch_signatures` lives in `role_protocol.py`, which
      is FLOORED (glob 3 of 17). A whole-diff comparison is therefore a P4
      commit, not a body edit, and the contract must be written so the
      unfloored half is worth landing on its own.

      Contract must answer: what "the sealed surface of a branch" means when it
      is not one file (a symbol KEY that survives a move, or a per-module
      union?); what happens to a legitimate move or rename, which is
      indistinguishable from this attack by symbol identity alone and is
      ordinary body work in Go; and whether Python's `_class_fingerprint`
      asymmetry — "adding a field to a scaffolded struct IS a signature change,
      adding a top-level declaration is not" — survives the widening or has to
      be restated.

      DO NOT propose "an added symbol is a change". That reverses an explicitly
      ruled rule ("a body may add private helpers") and would fail every honest
      branch. The measurement above is the same widening reaching the gate two
      ways; the contract has to separate them, not ban one input shape.
    type: Task
    estimate: 2h
    labels: [size:M, area:dispatcher]
    agent: claude
    role: scaffold
