  - key: W2-1-1
    summary: scaffold — the instructions the reviewer executes must not be writable by the branch under review
    description: |
      MEASURED at `feat/D1-role-protocol @ 6293f42`, by driving
      `role_protocol.validate` over a four-task probe worklist, one run per
      candidate path:

          ACCEPT  src/claude_dispatcher/reviewer_prompts/claude.md
          ACCEPT  src/claude_dispatcher/reviewer_prompts/_shared.md
          ACCEPT  src/claude_dispatcher/verifier_prompts/verifier.md
          RAISE   src/claude_dispatcher/role_protocol.py   (floor)
          RAISE   src/claude_dispatcher/orchestrator.py    (floor)
          RAISE   src/claude_dispatcher/loop_gate.py       (floor)

      ADJUDICATE's rule is `ALLOW_ONLY_GLOBS` with `globs=()`, "supplied per
      task by `disputed_paths:`". `**/reviewer_prompts/**` and
      `**/verifier_prompts/**` are DENY globs for SCAFFOLD and BODIES and an
      allowlist miss for SEALS — all three roles are refused. ADJUDICATE has no
      such row, and neither directory is on the floor. So a P4 task may declare
      the reviewer's prompt in `disputed_paths:` and rewrite it.

      THE PROTOCOL ALREADY STATES WHY THIS IS WRONG, in the comment that
      installs those deny globs for the other three roles: "those are
      machine-read instructions that the review gate executes, so editing them
      edits the reviewer that is about to judge the change." The rationale is
      not role-specific. ADJUDICATE is the one role it was never applied to.

      THE SHAPE. D1 closed the case where the most privileged role grants
      itself the POLICY (`role_protocol.py` in `disputed_paths:`). This is one
      level up: not the permission table, the PROMPT. A P4 that cannot widen
      what it may write can still rewrite the instructions of the thing that
      reads what it wrote.

      `_shared.md` is concatenated into EVERY reviewer seat's prompt by
      `cross_family_reviewer._load_prompt`, so one file reaches all seats.

      TWO MEASUREMENTS THAT SHAPE THE FIX, both taken at `6293f42`:

      (a) `cross_family_reviewer._PROMPTS_DIR = Path(__file__).parent /
          "reviewer_prompts"` — the prompt is read from the RUNNING package,
          not from the judged branch's worktree. So the exposure is not "this
          run is judged by the prompt this task just wrote"; it is "the edit
          lands, is merged, and every later run is judged by it", plus the
          dogfooding case where the running package IS the tree being built.
          State which of those the contract is closing. Do not overclaim the
          first: the honest statement is the one that survives.

      (b) `journal.py:578` already writes `"reviewer_prompts_hash":
          hash_tree(reviewer_prompts_dir)` into the run record. Measured:
          `grep -rn reviewer_prompts_hash src/ tests/` returns the writer, the
          `_REQUIRED` key list, and four test rows — and NOTHING that compares
          the hash to anything. It is a recorded fact, not a gate. A contract
          that turns it into a comparison is cheaper than a new mechanism.

      Contract must answer: whether the prompt trees join `FLOOR_GLOBS`, or
      ADJUDICATE gains a deny row, or the prompt is resolved from the BASE
      revision the way `scripts/check_body_branch.sh` already reads the gate's
      own code from the base; what a run does when the recorded hash and the
      loaded tree disagree (a NAMED state, never a silent load); and whether
      `docs/templates/planner-prompt.md` is in the same class.

      SAY WHICH HALF IS FLOORED. A `FLOOR_GLOBS` entry or an ADJUDICATE deny
      row is a `role_protocol.py` edit, which no role may make. The base-read
      fix in `cross_family_reviewer.py` and the hash comparison in
      `journal.py` are NOT floored. Prefer the unfloored fix if it is the
      honest one, and say so rather than choosing it because it is reachable.

      ---------------------------------------------------------------------
      RE-SCOPED 2026-08-17 after the first attempt was blocked by the panel.
      Your branch has been RESET to the current base; the previous attempt is
      preserved unmerged at `ref/W2-1-1-impl` and you may read it.

