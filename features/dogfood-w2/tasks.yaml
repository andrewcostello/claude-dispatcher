  # ---- W2-3  41 coverage claims nothing checks ---------------------------
  - key: W2-3-1
    summary: scaffold — a mutation-coverage claim needs a ledger, not a docstring
    description: |
      RE-COUNTED at `feat/D1-role-protocol @ 6293f42`:

          "Reddens under a body on:"   41   ALL in tests/test_call_site_reachability.py
          "Reddens on"                 19
          "Reddens under"               3
          other "Reddens ..." spellings 4

      THE RECORDED FIGURE WAS 45 AND IT IS 41. Two of the record's claims did
      not survive re-measurement and both make the unit SMALLER:

        1. "The convention has spread to the G1 and G2 seal files." It has not.
           Measured at `feat/G2-adj @ 83b0b97` and at `feat/G1-adj @ 11fd607`
           in `claude-workflow`: `grep -rho "Reddens[a-z ]*" --include=*.go`
           returns ZERO occurrences of any spelling. `cmd/gates/
           preserve_seal_test.go` and `cmd/iterate/preserve_seal_test.go` use a
           different convention entirely (`MEASURED:`, `PROOF OF EXECUTION:`,
           `WHY IT DESERVES A ROW.`). They are also in a different repository,
           which the dispatcher cannot reach in one run.
        2. Therefore the recorded reason for deferring this work — "a
           convention living in three files cannot be repaired in one" — NO
           LONGER HOLDS. It lives in one file, in this repository. That is the
           finding that makes this buildable.

      What the clauses claim: each names the mutations under which its row
      reddens. A prior P4 measured 43 of them and found 12 recorded against the
      SHIPPED body, 31 against a REFERENCE IMPLEMENTATION THAT WAS DISCARDED —
      so 31 clauses' evidence expired with it — and one that was never true
      (injecting the `AnalyzerError` swallow reddens the gap-4 row's six
      parametrisations and nothing else, so the header's claim that every
      injected mutation reddened the rows naming it was FALSE, not stale). It
      was struck.

      THE REFUSAL THIS UNIT MUST RESPECT, quoted so it is not re-derived:

        "A row over docstrings can check only that a clause is ACCOMPANIED by a
         word, never that anything was measured — it is satisfied by typing. A
         mechanism that can be defeated by a comment is not a mechanism.
         Building it ships the defect it was built to fix, one level further
         up."

      So: no mechanical row over docstrings. The ruled direction was A DURABLE
      LEDGER OUTSIDE THE DOCSTRINGS — a record of (row, mutation, revision,
      observed result) that a later reader can RE-RUN rather than re-read.

      The naming rule adopted instead has already spread and can be measured:
      `Measured under:` 118 occurrences, `Predicted (unmeasured) under:` 26, at
      `6293f42`. Where they live matters — `tests/test_branch_reachability.py`
      73/16, `tests/test_d5_floor.py` 36/5 — and where they DO NOT is the
      point: `tests/test_call_site_reachability.py`, the file holding all 41
      unlabelled clauses, carries exactly 1 and 1. D5's own relabelling
      obligation is still open.

      Contract must answer: what a ledger ENTRY is and what makes one stale (a
      revision that no longer exists, a body that changed, a reference
      implementation that was discarded); how a claim is RE-DERIVED rather than
      re-read; what happens when re-derivation disagrees with the record — a
      named state, never a silently kept entry; and what the ledger costs to
      run, because a ledger nobody runs is the docstring again in a file with a
      different extension.

      WHERE THE LEDGER MAY LIVE — a hard constraint on the contract you write,
      not a preference. The ledger is BUILT by W2-3-3, whose role is BODIES, and
      BODIES is denied `**/tests/**`, `**/test_*.py`, `**/*_test.py`,
      `**/*.test.*`, `**/testdata/**` and `**/conftest.py`. So the path you
      name for the ledger MUST NOT be under `tests/` or `testdata/`, MUST NOT
      match `test_*.py` / `*_test.py`, and MUST NOT be a `conftest.py`. Site it
      anywhere else you judge right, and state the path explicitly. A contract
      that sites its deliverable where its own body role is forbidden to create
      it ships a task that cannot be completed without a protocol breach.

      Note also that the 41 clauses live in `tests/test_call_site_reachability.py`,
      which W2-3-3 may not touch. Whatever you decide for them, the contract must
      be satisfiable by a body that only READS that file — the relabelling or
