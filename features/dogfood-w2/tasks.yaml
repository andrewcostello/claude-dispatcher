      OPERATOR ADJUDICATION, round 3. This is a NARROW round with a FINITE
      acceptance list. Do not redesign and do not chase every panel comment.

      Your contract is otherwise accepted: the role gate is clean, the suite passes,
      the verifier is satisfied, your declared holes were left correctly in both
      rounds, and prose:code is 0.75:1. Nothing about the shape is being questioned.

      WHY THIS BLOCKS. Judged on the design calibration (BLOCKING = ships a
      correctness/safety regression or makes the stated headline property false;
      MAJOR = a real gap that is additive to fix), the panel found FOUR independent
      ways to bypass the one property this unit exists to create. That is not
      iteration fatigue, it is the mechanism not holding.

      FIX THESE FIVE, and nothing else is required for acceptance:

      1. `check_prompt_tree` hashes `loaded.tree_dir` AFTER the caller populated
         `LoadedTree.members`. A modified prompt can be read into `members` and
         restored before the hash runs: the digest matches while modified bytes were
         rendered. Verify the bytes you loaded, not the directory you loaded them
         from.
      2. `UNRECORDED` -> `LOAD_UNRECORDED` makes ABSENCE of the security state
         permissive, and journaling is optional, so suppressing publication bypasses
         drift enforcement with a stderr warning. Absent evidence must deny.
      3. `ANCHOR_FAILED` is unreachable: every genesis that is written sets
         `reviewer_prompts_hash`. A state no input can reach is not a state; either
         make it reachable or strike it and say what covers the case.
      4. `record_anchor` overwrites an entry with the same `run_nonce`, so a second
         pin with a different digest re-anchors the run and a changed tree reads as
         ANCHORED. Your own contract says resume is idempotent and cannot re-anchor.
      5. `digest_of_snapshot` uses NUL as a field delimiter and NUL is legal inside
         file contents, so `[("a", b"b\x00c\x00")]` and `[("a", b"b"), ("c", b"")]`
         collide. The panel states this is exploitable on the real prompt tree.
         Length-prefix or otherwise unambiguously encode.

      ALSO FIX (verified by execution, so not arguable): `release_anchor` drops pins
      but leaves `_declaration`, moving a process ANCHORED -> UNANCHORED_DECLARED,
      which loads.

      EVERYTHING ELSE IS RECORDED, NOT OWED BY YOU. The remaining findings
      (`PinSource` vs `PromptLoadRecord` fields, process-global additive anchors with
      no release call site) are now carried automatically to W2-1-2 and W2-1-3, which
      inherit this task's recorded findings on dispatch. Do not chase them here.
