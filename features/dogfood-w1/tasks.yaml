# the measurement quoted in its description. None is speculative.
#
# WHY THESE FOUR. They are all Python in this repository, which is where the
# loop gate runs in 0.004s and the reachability arm takes the cheap exit. The Go
# work (#18, #25, #26, #28 in the operator's list) is deliberately held back:
# the reachability sweep costs 445s x2 on a Go tree and is ruled off until the
# host toolchain is fixed.
#
# ORDER. DF-1 (merged_sha) comes before DF-2 (merge authorization) because DF-2
# must not pin to a SHA source DF-1 proves is wrong.
#
# ROLE CHAIN. scaffold -> seals -> bodies -> adjudicate, each blockedBy the
# previous. The protocol refuses a 'bodies' task that names no 'seals' task in
# blockedBy: "an absent edge is a refusal, never an empty unit that passes".

tasks:

  # ---- DF-1  merged_sha is stale in 7/7 recorded merges -------------------
  - key: DF-1-1
    summary: scaffold — name what a merge record must prove about the SHA it names
    description: |
      MEASURED: every recorded merge stamps a merged_sha that does not track
      origin. Two DIFFERENT PRs merged in the same run record IDENTICAL
      post-merge SHAs, which is impossible if the ref followed origin.
      `_sync_local_feature_branch`'s `git fetch origin fb:fb` appears never to
      have succeeded. All 7 recorded pr_merged events are affected.

      Consequence: the audit trail cannot say what was merged.

      Contract must answer: where the authoritative SHA comes from (origin, not
      a local ref); what a merge record must carry to be checkable afterwards;
      and what happens when the fetch fails — that is a named state, never a
      silently stale stamp.

      DO NOT reuse `_feature_branch_sha` as the source. That is the value this
      unit proves wrong.

      Note test_merge_engine.py:313 is a truthiness check on that stamp — a seal
      passing on a value now known to be wrong. Say whether it is in scope.
    type: Task
    estimate: 1h
