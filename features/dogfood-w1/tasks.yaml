  # ---- DF-4  the cp -a clone hazard --------------------------------------
  - key: DF-4-1
    summary: scaffold — a scratch clone of a worktree must not reach the real repo
    description: |
      MEASURED, three separate agents this session, most recently a
      `git revert --no-commit` probe that MOVED THE REAL INDEX.

      Cause: `cp -a` of a LINKED WORKTREE copies `.git` as a FILE containing a
      gitdir pointer, so any git command inside the copy operates on the real
      repository.

      Every brief in this effort already says "remove the .git FILE first" and it
      kept happening. The durable fix is a helper, not another sentence.

      Contract must answer: what a scratch clone guarantees; how it fails when it
      cannot make that guarantee (a named state, never a silent copy); and
      whether it also handles the two adjacent hazards measured this session —
      `git checkout <tree> -- .` with --work-tree pointed elsewhere writing to
      the wrong index, and CPython keying bytecode on (mtime_seconds, size) so a
      same-size mutation restored within one second reports as covered when it is
      not.

      ## Unblock note (human)
      (cleared from Blocked: role_diff_loop_violation: 1 forbidden path(s) and 0 changed scaffolded signature(s))
      The role gate refused your branch: you wrote tests/test_scratch_clone.py. SCAFFOLD may not create or edit anything under tests/ — that is P2's file, and a scaffold author who writes the seals it will be judged by re-creates the circular oracle that produced 24 vacuous seals in this project. Write the contract and the stubs in src/ only; every function raises NotImplementedError with a message naming what is missing. Mark every silence in the design with a CHOICE comment giving the alternative you rejected and why. The seals are DF-4-2's job and a different author writes them. Note also: your first round PASSED the gate and the panel's CHANGES_REQUESTED is what led the second round to add tests — if the panel asks for tests again, that is a request you must refuse and record, not satisfy.

      ## Unblock note (human)
      (cleared from Blocked: role_diff_loop_violation: 1 forbidden path(s) and 0 changed scaffolded signature(s))
      ADJUDICATION 2 (operator). The previous block was the DISPATCHER's defect, not
      yours. Recorded as D-54 and now fixed in 417d4ac.

      What happened: the gate's base was the tip of your FIRST attempt, which
      contained tests/test_scratch_clone.py. So when you did exactly what the last
      note asked — removed it — the deletion counted as touching a forbidden path.
      There was no branch state you could have reached that the gate would call
      clean. You were right; the tool was wrong.

      The gate now judges an adjudicated retry from the base your first attempt
