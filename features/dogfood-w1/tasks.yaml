  # ---- DF-2  merge authorization vs the ref the merge acts on -------------
  - key: DF-2-1
    summary: scaffold — authorization and action must name the same ref
    description: |
      MEASURED, and the recorded description of this defect DID NOT SURVIVE
      MEASUREMENT. It was filed as "a verdict is produced and the merge does not
      prove the tree it merges is the tree judged". Wrong: the merge consumes NO
      verdict — grep for panel_consensus|panel_verdict_ across merge_engine.py,
      merge_prs.py, pr.py, plan.py, risk.py returns zero hits and the only
      readers are display code.

      ACCURATE STATEMENT: `risk.classify` diffs the LOCAL refs/heads/<branch> in
      repo_root with no fetch, while `gh pr merge` acts on ORIGIN's head.
      Authorization and action are computed against different refs.

      pr.py:226 builds [gh, pr, merge, N, --merge] with no --match-head-commit;
      that flag is real in the installed gh 2.46.0, so the fix is a dispatcher
      argv change, not a git operation.

      NOT hypothetical: 7 real pr_merged events across 25 runs against
      EvenPlay/evenplay-mono (#809/811/813/815) and andrewcostello/
      claude-dispatcher (#35/36/39). Loss is potential, not historical — both
      externally-approved merges had approval-commit == merged head (~21 and ~10
      minute windows).

      THE CONSTRAINT THAT SHAPES THE FIX: five of seven merges were low-risk
      SELF-APPROVALS. A fix that only hardens the `elevated` branch misses the
      majority path.

      CHEAPER THAN IT LOOKS: `gh pr view --json reviews` ALREADY returns a
      per-review commit.oid, and pr.py:158-177 iterates those objects keeping
      only state and author.login. Measured live against PR 813.

      The Go reviewer half is already fixed (reviewed_sha, cmd/reviewer/
      main.go:843) and claude-workflow contains no `gh pr merge`.
    type: Task
    estimate: 2h
    labels: [size:M, area:dispatcher]
    agent: claude
    role: scaffold
    status: To Do
