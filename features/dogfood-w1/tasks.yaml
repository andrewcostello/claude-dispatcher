  # ---- DF-5  the financial-paths fallback is a hand-maintained copy -------
  - key: DF-5-1
    summary: scaffold — the money-path fallback must not be a second hand-list
    description: |
      FOUND BY THE DRY RUN OF THIS VERY WORKLIST, before any task ran.

      `cli.py`'s FINANCIAL_PATHS default is a hand-maintained copy of
      evenplay-mono's money table. Measured: six patterns that PR #1387 added to
      close the wallet-calling-layer gap are ABSENT from it —
      bet_service, grpc_xwallet, adapter/wallet, playerfunds, liability,
      process_shot.

      This has happened before. Commit 0a457ff is titled "fix(pr-raise): sync
      the financial-paths fallback; it drifted within a day". Syncing it again
      buys another day.

      The class is already named in this repository: an earlier hand-list
      omitted `recheck_min_severity`, the safety floor, and an emitter built
      from it would have silently skipped every MEDIUM finding. The standing
      answer there was to DERIVE the list from the consumers' ASTs and fail hard
